name: Actualizar jugadores

# Los jueves a las 07:47 (Argentina). Baja, para todos los clubes activos, el plantel y las fichas de cada jugador
# (TMT y FETEMBA: ratings, rankings, partidos, palmarés). Es la parte pesada: unos 2 a 4 minutos por club.
# Después arma el sitio y lo publica.
# A mano: Actions → "Actualizar jugadores" → Run workflow (se puede elegir un club).

on:
  schedule:
    # 10:47 UTC = 07:47 en Argentina (minuto 47: a la hora en punto GitHub se satura)
    - cron: "47 10 * * 4"
  workflow_dispatch:
    inputs:
      club:
        description: "Club (slug, por ejemplo spin-tdm). Vacío = todos"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  actualizar:
    uses: ./.github/workflows/publicar.yml
    with:
      club: ${{ inputs.club }}
      jugadores: true
