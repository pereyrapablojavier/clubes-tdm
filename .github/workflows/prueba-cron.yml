name: Prueba de cron (temporal)

# TEMPORAL: sirve solo para comprobar que GitHub dispara tareas programadas en este repo. No publica ni toca nada.
# Corre cada 15 minutos; cuando se confirme, borrar este archivo.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prueba:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Mostrar la hora
        run: |
          echo "El cron funciona. Hora UTC: $(date -u +%H:%M). Evento: ${{ github.event_name }}"
