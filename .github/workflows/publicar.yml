name: Actualizar y publicar

# Flujo común: baja las partes que se pidan, guarda los datos en la rama "datos", arma el sitio y lo publica.
#
# - Manual (Actions → "Actualizar y publicar" → Run workflow): elegís el club y qué bajar.
# - Lo llaman las Actions con horario propio (cada una baja una parte, ver los archivos "actualizar-*.yml"):
#     Actualizar calendarios  → calendario de torneos, próximos partidos de Liga y Copa, Grand Slam y SS (todos los días)
#     Actualizar Liga y Copa  → tablas, resultados y sets (lunes y jueves)
#     Actualizar jugadores    → ratings y fichas de TMT y FETEMBA (jueves)
# - Al mergear cambios en main: solo arma y publica (no baja datos; sí baja los de un club nuevo).
# - Modo mantenimiento (Actions → "Modo mantenimiento"): activa o desactiva la página "Sitio en construcción".
#   El estado se guarda en la rama "datos" y TODAS las publicaciones lo respetan.
# Los datos descargados se guardan en la rama "datos" (no en main): así main tiene solo código.

on:
  workflow_dispatch:
    inputs:
      club:
        description: "Club (slug, por ejemplo spin-tdm). Vacío = todos"
        type: string
        default: ""
      jugadores:
        description: "Jugadores (TMT + FETEMBA: ratings, rankings, fichas)"
        type: boolean
        default: true
      calendario:
        description: "Calendario de torneos del club (TMT)"
        type: boolean
        default: true
      equipos:
        description: "Liga de Equipos y Copa de Clubes (fetembaequipos.ar)"
        type: boolean
        default: true
      solo_proximos:
        description: "De Liga y Copa, bajar solo los próximos partidos (rápido; sin tablas ni resultados)"
        type: boolean
        default: false
      circuito:
        description: "Grand Slam y Super Series (FETEMBA; solo baja si hay novedades)"
        type: boolean
        default: true
  workflow_call:
    inputs:
      club:
        type: string
        default: ""
      jugadores:
        type: boolean
        default: false
      calendario:
        type: boolean
        default: false
      equipos:
        type: boolean
        default: false
      solo_proximos:
        type: boolean
        default: false
      circuito:
        type: boolean
        default: false
      mantenimiento:
        description: "'activar' o 'desactivar' el modo mantenimiento (página Sitio en construcción); vacío = no tocar"
        type: string
        default: ""
      mensaje:
        description: "Mensaje opcional para la página en construcción"
        type: string
        default: ""
  push:
    branches: [main]
    paths: ["app/**", "clubes/**", "config/**", "scripts/**", ".github/workflows/publicar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    # Una corrida por vez (todas escriben en la rama "datos" y publican): las demás esperan su turno.
    concurrency:
      group: publicar
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy3.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy.outputs.page_url }}
    env:
      CLUBES_DATA: ${{ github.workspace }}/.datos
      BAJAR: ${{ github.event_name != 'push' }}
      JUGADORES: ${{ inputs.jugadores }}
      CALENDARIO: ${{ inputs.calendario }}
      EQUIPOS: ${{ inputs.equipos }}
      SOLO_PROXIMOS: ${{ inputs.solo_proximos }}
      CIRCUITO: ${{ inputs.circuito }}
      CLUB: ${{ inputs.club }}
      MANT: ${{ inputs.mantenimiento }}
      MENSAJE: ${{ inputs.mensaje }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Traer los datos guardados (rama datos)
        run: |
          if git ls-remote --exit-code --heads origin datos >/dev/null; then
            git fetch --depth 1 origin datos
            git worktree add "$CLUBES_DATA" FETCH_HEAD
            git -C "$CLUBES_DATA" switch -c datos
          else
            echo "La rama datos todavía no existe: se crea vacía y se llena con esta descarga."
            mkdir -p "$CLUBES_DATA"
            git -C "$CLUBES_DATA" init -q -b datos
            git -C "$CLUBES_DATA" remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - name: Qué se actualiza
        run: |
          club_arg=""
          if [ -n "$CLUB" ]; then
            if ! printf '%s' "$CLUB" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then echo "::error::Club inválido: $CLUB"; exit 1; fi
            club_arg="--club $CLUB"
          fi
          partes=""
          [ "$CALENDARIO" = true ] && partes="$partes calendario"
          [ "$JUGADORES" = true ] && partes="$partes jugadores"
          [ "$CIRCUITO" = true ] && partes="$partes circuito"
          equipos_arg=""
          [ "$EQUIPOS" = true ] && [ "$SOLO_PROXIMOS" = true ] && equipos_arg="--solo proximos"
          # descripción corta para el mensaje del commit de los datos
          desc=""
          [ "$CALENDARIO" = true ] && desc="$desc, calendario"
          if [ "$EQUIPOS" = true ]; then
            if [ "$SOLO_PROXIMOS" = true ]; then desc="$desc, próximos partidos"; else desc="$desc, Liga y Copa"; fi
          fi
          [ "$CIRCUITO" = true ] && desc="$desc, Grand Slam y SS"
          [ "$JUGADORES" = true ] && desc="$desc, jugadores"
          [ -n "$MANT" ] && desc="$desc, modo mantenimiento ($MANT)"
          {
            echo "CLUB_ARG=$club_arg"
            echo "PARTES=$partes"
            echo "EQUIPOS_ARG=$equipos_arg"
            echo "DESC=${desc#, }"
          } >> "$GITHUB_ENV"
          {
            echo "### Actualizar y publicar ($GITHUB_EVENT_NAME)"
            [ -n "$MANT" ] && echo "- Modo mantenimiento: $MANT"
            if [ "$BAJAR" = true ]; then
              echo "- Clubes: ${CLUB:-todos}"
              echo "- TMT / FETEMBA:${partes:- (nada)}"
              echo "- Liga y Copa: $([ "$EQUIPOS" = true ] && { [ "$SOLO_PROXIMOS" = true ] && echo 'solo próximos partidos' || echo 'todo'; } || echo no)"
            else
              echo "- Cambio en main: solo se arma y publica el sitio (no se bajan datos)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # El mensaje llega por variable de entorno y entre comillas (no se pega en el comando), así no puede ejecutar nada.
      - name: Modo mantenimiento
        if: env.MANT != ''
        run: python scripts/mantenimiento.py "$MANT" --mensaje "$MENSAJE" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Clubes nuevos (sin datos todavía)
        run: |
          nuevos=""
          for s in $(python scripts/clubcfg.py); do
            [ -f "$CLUBES_DATA/$s/tmt_raw.json" ] || nuevos="$nuevos --club $s"
          done
          echo "NUEVOS=$nuevos" >> "$GITHUB_ENV"
          [ -n "$nuevos" ] && echo "- Clubes nuevos: se bajan sus datos completos ($nuevos)" | tee -a "$GITHUB_STEP_SUMMARY" || true

      - name: Bajar los datos de los clubes nuevos
        if: env.BAJAR != 'true' && env.NUEVOS != ''
        continue-on-error: true
        run: |
          python scripts/scrape.py $NUEVOS
          python scripts/equipos.py $NUEVOS

      - name: Bajar TMT y FETEMBA
        if: env.BAJAR == 'true' && env.PARTES != ''
        continue-on-error: true
        run: python scripts/scrape.py $PARTES $CLUB_ARG

      - name: Bajar Liga de Equipos y Copa de Clubes
        if: env.BAJAR == 'true' && env.EQUIPOS == 'true'
        continue-on-error: true
        run: python scripts/equipos.py $CLUB_ARG $EQUIPOS_ARG

      - name: Guardar los datos (rama datos)
        if: env.BAJAR == 'true' || env.NUEVOS != ''
        run: |
          cd "$CLUBES_DATA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Datos sin cambios" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            git commit -q -m "Datos (${DESC:-clubes nuevos}): ${CLUB:-todos los clubes} ($(date -u +%Y-%m-%d))"
            git push -q origin HEAD:datos
            echo "Datos guardados en la rama datos" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Armar el sitio
        run: python scripts/build.py | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # La entrega final a GitHub Pages a veces falla por problemas pasajeros de GitHub (error 502, o "no se encontró el artefacto"
      # recién subido). Se intenta hasta 3 veces, con una espera entre cada una; recién si fallan las 3, la corrida falla.
      - name: Publicar en GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Esperar antes de reintentar (falla pasajera de GitHub)
        if: steps.deploy.outcome == 'failure'
        run: |
          echo "::warning::La publicación falló (suele ser un problema pasajero de GitHub); se reintenta en 30 s."
          echo "- ⚠️ La publicación falló y se reintentó (intento 2 de 3)." >> "$GITHUB_STEP_SUMMARY"
          sleep 30
      - name: Publicar en GitHub Pages (intento 2)
        id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Esperar antes del último intento
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: |
          echo "::warning::La publicación volvió a fallar; último intento en 60 s."
          echo "- ⚠️ La publicación volvió a fallar (intento 3 de 3)." >> "$GITHUB_STEP_SUMMARY"
          sleep 60
      - name: Publicar en GitHub Pages (intento 3)
        id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
